<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Євгенія Економова · коуч ICF · стратегічні сесії</title>
<meta name="description" content="Стратегічні сесії та коучинг: ясність, фокус, дохід, енергія. Онлайн, українською та російською.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Onest:wght@500;600;700&display=swap" rel="stylesheet">
<link href="https://assets.calendly.com/assets/external/widget.css" rel="stylesheet">
<style>
:root{
  --bg:#F3F0EA;--paper:#FBF9F5;--ink:#14110F;--muted:#6B635B;--line:rgba(20,17,15,.14);
  --accent:#F0461A;--on-dark:#F3F0EA;--r:6px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'Manrope',system-ui,sans-serif;font-size:16px;line-height:1.6;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
img{display:block;max-width:100%}
a{color:inherit}
.wrap{max-width:1200px;margin:0 auto;padding:0 24px}
h1,h2,h3{font-family:'Onest','Manrope',sans-serif;font-weight:600;letter-spacing:-.03em;line-height:1.02}
section{padding:104px 0;scroll-margin-top:60px}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin-bottom:22px;display:flex;align-items:center;gap:12px}
.eyebrow::before{content:"";width:28px;height:2px;background:currentColor}
h2{font-size:clamp(32px,4.6vw,56px);margin-bottom:28px}
.sub{font-size:18px;color:var(--muted);max-width:560px}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:10px;background:var(--ink);color:var(--on-dark);padding:15px 26px;border-radius:999px;text-decoration:none;font-weight:600;font-size:15px;border:1px solid var(--ink);transition:.2s;cursor:pointer;font-family:inherit}
.btn::after{content:"→";color:var(--accent);transition:transform .2s}
.btn:hover{background:var(--accent);border-color:var(--accent)}
.btn:hover::after{color:var(--on-dark);transform:translateX(3px)}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.ghost:hover{background:var(--ink);color:var(--on-dark);border-color:var(--ink)}
.btn.ghost:hover::after{color:var(--accent)}
.btn.sm{padding:10px 18px;font-size:14px}
.btn.light{background:var(--on-dark);color:var(--ink);border-color:var(--on-dark)}
.btn.light:hover{background:var(--accent);color:var(--on-dark);border-color:var(--accent)}
.btn.outline-light{background:transparent;color:var(--on-dark);border-color:rgba(243,240,234,.4)}
.btn.outline-light:hover{background:var(--on-dark);color:var(--ink);border-color:var(--on-dark)}

/* header */
header{position:sticky;top:0;z-index:20;background:rgba(243,240,234,.9);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
header .wrap{display:flex;align-items:center;justify-content:space-between;height:64px;gap:16px}
.logo{font-family:'Onest',sans-serif;font-weight:700;letter-spacing:-.02em;text-decoration:none;font-size:18px}
nav{display:flex;align-items:center;gap:28px;font-size:14px;font-weight:500}
nav a.l{text-decoration:none;color:var(--muted);transition:color .2s}
nav a.l:hover{color:var(--ink)}
.right{display:flex;align-items:center;gap:14px}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;padding:2px}
.lang button{background:none;border:0;padding:5px 11px;font:inherit;font-size:12px;font-weight:700;letter-spacing:.04em;cursor:pointer;color:var(--muted);border-radius:999px}
.lang button.on{background:var(--ink);color:var(--on-dark)}

/* hero */
.hero{padding:72px 0 96px}
.hero .wrap{display:grid;grid-template-columns:1.25fr 1fr;gap:64px;align-items:center}
.hero h1{font-size:clamp(46px,7.4vw,100px);margin-bottom:28px;letter-spacing:-.04em}
.hero h1 em{font-style:normal;color:var(--accent)}
.hero .sub{margin-bottom:36px}
.cta-row{display:flex;gap:12px;flex-wrap:wrap}
.meta-row{display:flex;gap:36px;margin-top:52px;padding-top:24px;border-top:1px solid var(--line);flex-wrap:wrap}
.meta-row div{font-size:13px;color:var(--muted)}
.meta-row b{display:block;font-family:'Onest',sans-serif;font-size:20px;color:var(--ink);font-weight:600;letter-spacing:-.02em}
.ph{border-radius:var(--r);overflow:hidden;background:#d9d3ca}
.ph img{width:100%;height:100%;object-fit:cover}
.hero .ph{aspect-ratio:4/5}
.hero .ph img{object-position:50% 38%}

/* signs */
.signs-grid{display:grid;grid-template-columns:1fr 1.1fr;gap:72px;align-items:start}
.rows{list-style:none;border-top:1px solid var(--line)}
.rows li{display:flex;gap:24px;align-items:baseline;padding:24px 0;border-bottom:1px solid var(--line);font-family:'Onest',sans-serif;font-size:clamp(20px,2.4vw,28px);letter-spacing:-.02em;font-weight:500;line-height:1.2}
.rows li span{font-family:'Manrope',sans-serif;font-size:13px;font-weight:700;color:var(--accent);letter-spacing:.06em;min-width:28px}
.areas{margin-top:36px}
.areas .lab{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:12px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips span{border:1px solid var(--line);border-radius:999px;padding:7px 16px;font-size:14px;font-weight:500;background:var(--paper)}

/* services */
.services{background:var(--paper);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.svc{display:grid;grid-template-columns:64px 1fr 1.35fr 210px;gap:32px;padding:44px 0;border-top:1px solid var(--line)}
.svc:first-of-type{margin-top:40px}
.svc:last-child{border-bottom:1px solid var(--line)}
.svc-n{font-family:'Onest',sans-serif;font-size:15px;font-weight:700;color:var(--accent);padding-top:6px}
.svc h3{font-size:clamp(26px,3vw,38px);margin-bottom:14px}
.svc .lead{color:var(--muted);font-size:16px}
.svc-body p{margin-bottom:14px}
.svc-body .note{font-size:14px;color:var(--muted)}
.tags{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 18px}
.tags span{font-size:12px;font-weight:600;letter-spacing:.04em;background:var(--bg);border-radius:999px;padding:5px 12px;border:1px solid var(--line)}
.svc-side{display:flex;flex-direction:column;gap:16px;align-items:flex-start;min-width:0}
.svc-side .price{font-size:26px}
.price{font-family:'Onest',sans-serif;font-size:32px;font-weight:600;letter-spacing:-.03em;line-height:1}
.price small{display:block;font-family:'Manrope',sans-serif;font-size:13px;font-weight:500;color:var(--muted);letter-spacing:0;margin-top:6px}
details{border-top:1px solid var(--line);margin-top:6px}
details+details{margin-top:0}
summary{list-style:none;cursor:pointer;padding:16px 0;font-weight:600;font-size:15px;display:flex;justify-content:space-between;align-items:center;gap:16px}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";font-size:22px;font-weight:400;color:var(--accent);line-height:1;transition:transform .2s}
details[open] summary::after{transform:rotate(45deg)}
details .in{padding:0 0 18px}
details h4{font-family:'Onest',sans-serif;font-size:14px;font-weight:600;margin:14px 0 8px}
details h4:first-child{margin-top:0}
details ul{list-style:none}
details li{position:relative;padding-left:20px;margin-bottom:8px;font-size:15px;line-height:1.5}
details li::before{content:"";position:absolute;left:0;top:.65em;width:8px;height:2px;background:var(--accent)}
details p{font-size:15px}
.stage{margin-bottom:12px}
.stage b{display:block;font-family:'Onest',sans-serif;font-size:14px;margin-bottom:2px}

/* orange band */
.band{background:var(--accent);color:#FFF4EA;padding:0;overflow:hidden}
.band .wrap{display:grid;grid-template-columns:1.2fr 1fr;gap:64px;align-items:center;padding-top:96px;padding-bottom:96px}
.band h2{font-size:clamp(34px,5vw,68px);margin-bottom:22px;letter-spacing:-.035em}
.band p{font-size:18px;opacity:.92;max-width:480px;margin-bottom:32px}
.band .ph{aspect-ratio:4/5;background:#c93a14}
.band .ph img{object-position:50% 52%}

/* packages */
.pk-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:44px}
.pk{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:32px;display:flex;flex-direction:column;gap:8px;min-height:360px}
.pk .k{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between;gap:8px}
.pk .k i{font-style:normal;color:var(--accent)}
.pk h3{font-size:34px;margin-top:10px}
.pk .d{color:var(--muted);font-size:15px;flex:1}
.pk .price{margin-top:18px;font-size:44px}
.pk .btn{margin-top:20px;align-self:flex-start}
.pk.feat{background:var(--ink);color:var(--on-dark);border-color:var(--ink)}
.pk.feat .k,.pk.feat .d,.pk.feat .price small{color:rgba(243,240,234,.7)}
.pk.feat .k i{color:var(--accent)}
.single{margin-top:22px;font-size:15px;color:var(--muted)}
.single b{color:var(--ink);font-family:'Onest',sans-serif;font-weight:600}

/* about */
.about{background:var(--paper);border-top:1px solid var(--line)}
.about .wrap{display:grid;grid-template-columns:.9fr 1.1fr;gap:80px;align-items:center}
.about .ph{aspect-ratio:4/5}
.about .ph img{object-position:50% 14%}
.about p{color:var(--muted);margin-bottom:16px;font-size:17px;max-width:540px}
.facts{display:flex;gap:44px;margin-top:36px;padding-top:28px;border-top:1px solid var(--line);flex-wrap:wrap}
.facts b{display:block;font-family:'Onest',sans-serif;font-size:40px;font-weight:600;letter-spacing:-.03em;line-height:1}
.facts span{font-size:13px;color:var(--muted)}

/* contact */
.contact{background:var(--ink);color:var(--on-dark);padding:0}
.contact .wrap{display:grid;grid-template-columns:1.2fr 1fr;gap:72px;align-items:center;padding-top:104px;padding-bottom:104px}
.contact h2{font-size:clamp(36px,5.4vw,72px);letter-spacing:-.04em}
.contact p{color:rgba(243,240,234,.72);font-size:18px;max-width:480px;margin-bottom:34px}
.contact .ph{aspect-ratio:4/5;background:#2a2521}
.contact .ph img{object-position:50% 30%}
.links{display:flex;gap:22px;margin-top:34px;flex-wrap:wrap;font-size:14px}
.links a{color:rgba(243,240,234,.8);text-decoration:none;border-bottom:1px solid rgba(243,240,234,.3);padding-bottom:2px}
.links a:hover{color:var(--on-dark);border-color:var(--accent)}

footer{padding:28px 0;font-size:13px;color:var(--muted);background:var(--bg)}
footer .wrap{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}

.g{color:#9b948b}
.contact .g{color:rgba(243,240,234,.5)}
.rows.q li{font-size:clamp(17px,1.8vw,21px);line-height:1.3;padding:20px 0;font-weight:500}
.more{margin-top:26px;font-size:16px}
.more a{border-bottom:1px solid var(--accent);text-decoration:none;font-weight:600}
.results{background:var(--paper);border-top:1px solid var(--line)}
.res-lead{display:grid;grid-template-columns:1fr 1fr;gap:56px;margin-bottom:56px}
.res-lead p{font-size:19px;line-height:1.55}
.res-lead p.m{color:var(--muted)}
.res-grid{display:grid;grid-template-columns:1fr;gap:16px}
.case.feat{display:grid;grid-template-columns:1fr 1.1fr;gap:28px 64px;align-items:start;padding:44px}
.case.feat details{grid-column:1/-1;margin-top:0}
.case.dark details{border-color:rgba(243,240,234,.18)}
.lft>*+*{margin-top:18px}
.ba{display:grid;grid-template-columns:1fr 1fr;gap:28px}
.ba h5{font-family:'Manrope',sans-serif;font-size:12px;letter-spacing:.12em;text-transform:uppercase;margin-bottom:10px;color:var(--muted);font-weight:700}
.case.dark .ba h5{color:rgba(243,240,234,.55)}
.ba .after h5{color:var(--accent)}
.ba ul{list-style:none}
.ba li{font-size:15px;line-height:1.45;padding:11px 0;border-top:1px solid var(--line)}
.case.dark .ba li{border-color:rgba(243,240,234,.18)}
.story{display:grid;grid-template-columns:1fr 1fr;gap:6px 56px}
.story>div{margin-bottom:10px}
.adv{margin-top:8px;font-family:'Onest',sans-serif;font-size:20px;line-height:1.3;letter-spacing:-.01em;color:var(--accent)}
.case{border:1px solid var(--line);border-radius:12px;padding:36px;background:var(--bg);display:flex;flex-direction:column;gap:18px}
.case.dark{background:var(--ink);color:var(--on-dark);border-color:var(--ink)}
.case .who{font-size:12px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--accent)}
.case blockquote{font-family:'Onest',sans-serif;font-size:clamp(22px,2.4vw,30px);line-height:1.2;letter-spacing:-.02em;font-weight:500}
.case .out{font-size:16px;color:var(--muted)}
.case.dark .out{color:rgba(243,240,234,.75)}
.mini{list-style:none;border-top:1px solid rgba(243,240,234,.18);padding-top:16px}
.mini li{position:relative;padding-left:20px;margin-bottom:8px;font-size:15px}
.mini li::before{content:"";position:absolute;left:0;top:.65em;width:8px;height:2px;background:var(--accent)}
.note-small{margin-top:22px;font-size:13px;color:var(--muted);display:inline-block}
/* draft markers: remove this rule when the content is final */
.todo{background:#fff1a8;color:#14110F;padding:0 4px;border-radius:3px}

@media(max-width:960px){
  section{padding:72px 0}
  nav a.l{display:none}
  .hero{padding:40px 0 64px}
  .hero .wrap,.signs-grid,.band .wrap,.about .wrap,.contact .wrap{grid-template-columns:1fr;gap:40px}
  .hero .ph,.band .ph,.about .ph,.contact .ph{max-width:440px}
  .band .wrap,.contact .wrap{padding-top:64px;padding-bottom:64px}
  .svc{grid-template-columns:1fr;gap:18px;padding:36px 0}
  .svc-n{padding:0}
  .pk-grid{grid-template-columns:1fr}
  .res-lead{grid-template-columns:1fr;gap:24px}
  .case.feat{grid-template-columns:1fr;gap:24px;padding:26px}
  .ba,.story{grid-template-columns:1fr;gap:20px}
  .pk{min-height:0}
}
@media(max-width:520px){
  .wrap{padding:0 18px}
  .btn.sm{display:none}
  .meta-row{gap:24px}
}
</style>
</head>

<script>
(function(){
  /* ====== ВАШІ ПОСИЛАННЯ — замініть ці 4 рядки ====== */
  var LINKS = {
    calendly:  'https://calendly.com/ekonomovaevgeniya/30min',
    telegram:  'https://t.me/evvenne',
    instagram: 'https://instagram.com/your_username',
    email:     'mailto:hello@example.com'
  };
  /* ================================================= */

  document.querySelectorAll('[data-link]').forEach(function(a){
    var k=a.getAttribute('data-link');
    a.setAttribute('href',LINKS[k]);
    if(k!=='email'){a.setAttribute('target','_blank');a.setAttribute('rel','noopener');}
    if(k==='calendly'){
      a.addEventListener('click',function(e){
        if(window.Calendly && LINKS.calendly.indexOf('your-name')===-1){
          e.preventDefault();
          Calendly.initPopupWidget({url:LINKS.calendly});
        }
      });
    }
  });

  var els=document.querySelectorAll('[data-ua]');
  function set(l){
    document.documentElement.lang=l;
    els.forEach(function(e){e.innerHTML=e.getAttribute(l==='ru'?'data-ru':'data-ua');});
    document.querySelectorAll('.lang button').forEach(function(b){b.classList.toggle('on',b.dataset.l===l);});
    try{localStorage.setItem('lang',l);}catch(e){}
  }
  document.querySelectorAll('.lang button').forEach(function(b){b.onclick=function(){set(b.dataset.l);};});
  var s=(navigator.language||'uk').toLowerCase().indexOf('ru')===0?'ru':'uk';
  try{s=localStorage.getItem('lang')||s;}catch(e){}
  set(s);
})();
</script>
